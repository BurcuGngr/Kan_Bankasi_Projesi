name: Testleri Çalıştır

# Ne zaman tetiklenir: main dalına her push'ta VE main'e açılan her
# pull request'te. Böylece bozuk kod main'e girmeden önce yakalanır.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Testleri çalıştır
        run: python -m pytest -v